spring:
  r2dbc:
    url: r2dbc:h2:mem:///vendortestdb;DB_CLOSE_DELAY=-1

vendor:
  sync:
    enabled: false
  api:
    # Comfortably below the 2s delay stubbed by
    # VendorApiClientResilienceTest#timesOutOnSlowVendorAndFallsBackToEmpty
    # (so that test still exercises a real timeout), but high enough that an
    # immediately-responding WireMock stub doesn't spuriously trip the
    # timeout under CI runner CPU/scheduling jitter (observed flakiness in
    # recoversAfterTransientFailuresThenSuccess at 300ms on shared runners).
    connect-timeout-millis: 1000
    response-timeout-millis: 1000

order:
  kafka:
    consumer:
      enabled: false

resilience4j:
  retry:
    instances:
      vendorApi:
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: false
  circuitbreaker:
    instances:
      vendorApi:
        sliding-window-size: 10
        minimum-number-of-calls: 10
  ratelimiter:
    instances:
      vendorApi:
        limit-for-period: 1000
        limit-refresh-period: 1s
        timeout-duration: 0s
